- name: NordStellar Enterprise Data API
  description: >-
    Also marketed as the NordStellar Dark Web API. Breach-intelligence data API over malware/infostealer
    logs, breached databases, credential lists, cookie and password intelligence, and dark web sources,
    with domain, email, phone, credit card and national-ID intelligence endpoints plus API user and
    subscription management. 85 operations across 15 tagged capability areas, OpenAPI 3.1.
  humanURL: https://docs.nordstellar.com/enterprise-apis/product-integrations
