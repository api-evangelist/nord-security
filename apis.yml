apis:
- name: NordStellar MCP Server
  description: >-
    Remote MCP server that lets any MCP-compatible assistant query the NordStellar platform in natural
    language. Clients connect through the open-source nordstellar-mcp auth proxy (PyPI, run via uvx, or
    a one-click .mcpb bundle for Claude Desktop), which performs a browser login and stores session tokens
    in the OS credential store. The server fronts NordStellar's GraphQL core and exposes graphql_query,
    graphql_batch, search_types and get_type_definition. Live tools/list is auth-gated (HTTP 401 "no bearer
    token").
  humanURL: https://docs.nordstellar.com/platform/mcp
  baseURL: https://platform-mcp.nordstellar.com/mcp
  tags:
  - MCP
  - agent-native
  - Threat Intelligence
  - GraphQL
  tags_raw:
  - mcp
  - agent-native
  - threat-intelligence
  - graphql
  properties:
  - type: MCPServer
    url: mcp/nord-security-mcp.yml
  - type: ToolCrosswalk
    url: mcp/nord-security-tool-crosswalk.yml
  - type: MCPServer
    url: https://platform-mcp.nordstellar.com/mcp
  - type: Documentation
    url: https://docs.nordstellar.com/platform/mcp/setup
  - type: AgentSkill
    url: skills/_index.yml
  - type: SourceCode
    url: https://github.com/NordStellar/nordstellar-mcp
- name: NordLayer Partner / MSP API
  description: >-
    Partner-facing API behind the NordLayer Service Management Portal. API keys are self-issued in the
    SMP Integrations tab with expiry and one-time visibility, and let MSPs create client organizations,
    retrieve account details and statuses, and track license usage. The help centre links a "NordLayer
    MSP API Documentation" PDF for the full specification, but that published link currently returns 404,
    so no machine-readable contract is publicly retrievable.
  humanURL: https://help.nordlayer.com/docs/api-key-management-for-smp
  baseURL: https://api.nordlayer.com/
  tags:
  - MSP
  - Partner API
  - Provisioning
  - Network Security
  tags_raw:
  - msp
  - partner-api
  - provisioning
  - network-security
  properties:
