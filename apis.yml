- name: NordLayer Partner / MSP API
  description: >-
    Partner-facing API behind the NordLayer Service Management Portal. API keys are self-issued in the
    SMP Integrations tab with expiry and one-time visibility, and let MSPs create client organizations,
    retrieve account details and statuses, and track license usage. The help centre links a "NordLayer MSP
    API Documentation" PDF for the full specification, but that published link currently returns 404, so
    no machine-readable contract is publicly retrievable.
  humanURL: https://help.nordlayer.com/docs/api-key-management-for-smp
  baseURL: https://api.nordlayer.com/
  tags:
  - msp
  - partner-api
  - provisioning
  - network-security
  properties:
  - type: Documentation
    url: https://help.nordlayer.com/docs/api-key-management-for-smp
  - type: Authentication
    url: authentication/nord-security-authentication.yml
  x-evidence:
    fetched: '2026-08-01'
    base_url_probe:
      url: https://api.nordlayer.com/
      http_status: 404
      content_type: application/json
      body: '{"code":404,"message":"Resource not found"}'
      note: >-
        Host resolves and answers a JSON error envelope; individual endpoint paths are not published
        outside the partner-gated MSP API PDF.
    spec_link:
      url: https://cdn.document360.io/fc1049cd-8f71-4b89-b9b8-dbca9fdcdd16/Images/Documentation/NordLayer%20MSP%20API%20Documentation.pdf
      http_status: 404
      note: Linked from help.nordlayer.com/docs/api-key-management-for-smp; asset no longer present.
- name: NordLayer SCIM 2.0 Provisioning
  description: >-
    SCIM-based user provisioning surface used to create users, update user attributes, deactivate users
    and push groups from Okta and Microsoft Entra ID into NordLayer. The SCIM secret token is issued in
    the NordLayer Control Panel under Settings > Access management; the endpoint is configured through
    the identity provider's NordLayer application rather than published as a standalone base URL.
  humanURL: https://help.nordlayer.com/docs/user-provisioning
  baseURL: https://api.nordlayer.com/
  tags:
  - scim
  - provisioning
  - identity
  - sso
  properties:
  - type: Documentation
    url: https://help.nordlayer.com/docs/user-provisioning
  - type: Conformance
    url: conformance/nord-security-conformance.yml
- name: NordPass Provider API
  description: >-
    Usage-reporting API for NordPass provider/MSP partners, documented in the NordPass help centre.
    NordPass separately supports SCIM provisioning from Okta and Microsoft Entra ID for NordPass Business.
    The provider API reference sits behind a bot-protected help centre and no machine-readable contract is
    published.
  humanURL: https://support.nordpass.com/hc/en-us/articles/23164869782801-Provider-API-for-Usage-Reporting
  baseURL: https://api.nordpass.com/
  tags:
  - msp
  - usage-reporting
  - password-management
  - scim
  properties:
  - type: Documentation
    url: https://support.nordpass.com/hc/en-us/articles/23164869782801-Provider-API-for-Usage-Reporting
  x-evidence:
    fetched: '2026-08-01'
    base_url_probe:
      url: https://api.nordpass.com/
      http_status: 403
      content_type: application/json
      body: '{"status":403,"title":"Access Forbidden","type":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403"}'
      note: Host resolves and answers a problem-shaped JSON envelope; endpoint paths are not published.
- name: NordVPN Public Server API
  description: >-
    Unauthenticated JSON API that NordVPN's own clients and the open-source Linux client use to enumerate
    the server estate — servers, countries, cities, groups and technologies. It is publicly reachable and
    widely consumed, but Nord Security publishes no developer documentation, no OpenAPI and no terms for
    it, so it should be treated as an internal client API rather than a supported product API.
  humanURL: https://github.com/NordSecurity/nordvpn-linux
  baseURL: https://api.nordvpn.com/v1
  tags:
  - vpn
  - server-directory
  - undocumented
  properties:
  - type: SourceCode
    url: https://github.com/NordSecurity/nordvpn-linux
  x-evidence:
    fetched: '2026-08-01'
    probes:
    - url: https://api.nordvpn.com/v1/servers/countries
      http_status: 200
      content_type: application/json
    - url: https://api.nordvpn.com/v1/technologies
      http_status: 200
      content_type: application/json
    - url: https://api.nordvpn.com/openapi.json
      http_status: 403
      note: No OpenAPI published; host bot-protects non-client paths.
