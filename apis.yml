- name: NordStellar Cybersec API
  description: >-
    URL and file scanning API with allow/deny list management and account usage control (AUC).
    23 operations, OpenAPI 3.0, bearer-token authentication, with documented X-RateLimit headers and
    Retry-After handling on 429.
  humanURL: https://docs.nordstellar.com/enterprise-apis/cybersec/swagger
  baseURL: https://cybersec.nordstellar.com
