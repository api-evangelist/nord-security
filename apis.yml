- name: NordStellar Platform Integrations API
  description: >-
    Connects NordStellar's monitoring features to external security tools, dashboards and automated
    workflows — events, alerts and platform data for SIEM/SOAR forwarding. Three published versions
    (v1/v2/v3) are served side by side from the same reference; v3 is the default. Bearer authentication,
    RFC 9457 problem+json errors. Also consumed by the NordStellar n8n community node.
  humanURL: https://docs.nordstellar.com/platform/integrations-api
  baseURL: https://platform-integration-api.nordstellar.com
  tags:
