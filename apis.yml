- name: NordStellar MCP Server
  description: >-
    Remote MCP server that lets any MCP-compatible assistant query the NordStellar platform in natural
    language. Clients connect through the open-source nordstellar-mcp auth proxy (PyPI, run via uvx, or a
    one-click .mcpb bundle for Claude Desktop), which performs a browser login and stores session tokens
    in the OS credential store. The server fronts NordStellar's GraphQL core and exposes graphql_query,
    graphql_batch, search_types and get_type_definition. Live tools/list is auth-gated (HTTP 401
    "no bearer token").
  humanURL: https://docs.nordstellar.com/platform/mcp
  baseURL: https://platform-mcp.nordstellar.com/mcp
  tags:
  - mcp
  - agent-native
  - threat-intelligence
  - graphql
  properties:
  - type: MCPServer
    url: mcp/nord-security-mcp.yml
