- name: NordVPN Public Server API
  description: >-
    Unauthenticated JSON API that NordVPN's own clients and the open-source Linux client use to enumerate
    the server estate — servers, countries, cities, groups and technologies. It is publicly reachable
    and widely consumed, but Nord Security publishes no developer documentation, no OpenAPI and no terms
    for it, so it should be treated as an internal client API rather than a supported product API.
  humanURL: https://github.com/NordSecurity/nordvpn-linux
  baseURL: https://api.nordvpn.com/v1
  tags:
  - VPN
  - server-directory
  - Undocumented
  tags_raw:
