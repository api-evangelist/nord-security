aid: nord-security
name: Nord Security
description: >-
  Nord Security is a Lithuania-founded digital security and privacy company whose consumer and business
  portfolio spans NordVPN, NordPass, NordLocker, NordLayer (network access security for business),
  NordProtect/Coveron, Saily (eSIM) and NordStellar (external threat exposure management). Its
  developer-facing surface is concentrated in NordStellar, which publishes five OpenAPI-described
  enterprise APIs — the Enterprise Data (Dark Web) API, Company Risk Scoring API, Cybersec API,
  Partners API and Platform Integrations API — plus a remote MCP server, sixteen provider-published
  agent skills, an n8n community node and SIEM integrations (Microsoft Sentinel, CrowdStrike).
  NordLayer adds SCIM 2.0 user provisioning and a partner/MSP API key surface, while the NordSecurity
  GitHub organization publishes the NordVPN Linux client together with 43 gRPC/protobuf service
  definitions covering the daemon, meshnet, fileshare, norduser and telemetry surfaces.
