- name: NordStellar Company Risk Scoring API
  description: >-
    Evaluates the cybersecurity risk of an external company identified primarily by domain name,
    returning scored risk assessments for third-party/vendor risk workflows. 14 operations, OpenAPI 3.1,
    API key header or HTTP Basic authentication.
  humanURL: https://docs.nordstellar.com/enterprise-apis/crs/swagger
  baseURL: https://enterprise-crs-api.nordstellar.com
