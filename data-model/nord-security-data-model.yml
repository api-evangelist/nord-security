    company-risk-scoring-api: 31
    partners-api: 16
  note: >-
    Two disjoint models. The Enterprise Data API is an IDENTIFIER-CENTRIC lookup model — you present an
    email, phone, domain, credit card or national ID and receive the breach records that touch it. The
    Platform Integrations API is a PROJECT/EVENT model — a Project scopes Assets, and every finding is
    an Event subtype carrying project_id + asset_id. Nothing in the Enterprise Data model references a
    project; nothing in the Platform model references the identifier lookups.
