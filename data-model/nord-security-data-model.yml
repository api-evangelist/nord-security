id_conventions:
  format: uuid
  fields: [id, project_id, asset_id, cve_id]
  note: >-
    UUIDs throughout the Platform Integrations model; no typed/prefixed identifiers anywhere in the
    estate. The Enterprise Data model is keyed on the natural identifier presented (email address,
    phone number, domain), not on synthetic ids.
graphql_note: >-
  The MCP/GraphQL core exposes a third projection of this data (projectsV2, eventsProjectionsV2,
  assetsProjections, attackSurface*, domainPermutations*, malwareInfections*) with items/totalCount
  envelopes. No SDL is published, so its type graph is not modelled here — see
  mcp/nord-security-tool-crosswalk.yml.
