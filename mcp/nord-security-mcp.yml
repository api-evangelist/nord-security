  source_code: https://github.com/NordStellar/nordstellar-mcp
  license: GPL-3.0
  architecture: Remote MCP server fronted by a local auth proxy. Clients run the open-source `nordstellar-mcp`
    Python proxy (PyPI, launched with `uvx nordstellar-mcp https://platform-mcp.nordstellar.com/mcp`)
    or install the prebuilt .mcpb bundle in Claude Desktop. On first use the proxy opens a browser window
    for NordStellar login, then stores the session in the OS credential store (macOS Keychain, Windows
    Credential Locker, Freedesktop Secret Service) under the service name "NordStellar MCP" and relays
    tool calls to the remote server.
  backing_surface: GraphQL
  backing_surface_note: The server is a thin MCP facade over NordStellar's GraphQL core, not over the
    REST OpenAPI estate. Its README states the point is that you "no need to ... write GraphQL by hand".
authentication:
  scheme: bearer
  flow: browser login handled by the local proxy; session tokens refreshed automatically
  credential_store: OS keyring (service name "NordStellar MCP")
  logout: nordstellar-mcp --logout
  oauth_metadata:
    well_known_oauth_authorization_server: 404
    well_known_oauth_protected_resource: 404
    note: No RFC 8414 / RFC 9728 discovery documents are published on the MCP host.
