    operations: 169
    gated: false
  graphql:
    endpoint: unpublished
    reachable_via: the MCP server's graphql_query / graphql_batch tools
    introspection: gated (no anonymous GraphQL endpoint is documented or discoverable)
    note: >-
      The GraphQL schema is real and is the platform's primary internal contract — NordStellar's
      published skills contain dozens of concrete queries against it — but Nord Security publishes no
      GraphQL endpoint URL, no SDL and no introspection surface. The root fields below were read out of
      the provider's own SKILL.md files; they are evidence of the surface, not a schema.
  mcp:
    url: https://platform-mcp.nordstellar.com/mcp
    tools_list: gated (HTTP 401 "no bearer token")
    tools_named: 4
