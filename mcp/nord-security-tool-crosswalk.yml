headline: >-
  NordStellar's MCP surface and its REST surface are projections of DIFFERENT cores, and they do not
  overlap at the operation level. The MCP server exposes four generic GraphQL meta-tools over the
  platform's GraphQL schema; the OpenAPI estate describes 169 REST operations across five separate
  APIs. Not one MCP tool binds to a REST operationId, and not one REST operation has a dedicated tool.
  Recording this divergence honestly is the point of this artifact — a name-similarity crosswalk here
  would be fabrication.
