gaps:
- >-
  Because every MCP tool is a generic GraphQL executor, agents get no per-capability tool schemas.
  Discoverability depends entirely on the 16 published skills, not on tools/list.
- >-
  The 169 REST operations are invisible to MCP clients. An agent connected to the NordStellar MCP
  server cannot reach the Enterprise Data (Dark Web) API, the Company Risk Scoring API, the Cybersec
  API or the Partners API at all.
