  note: >-
    Nord Security ships no conventional REST client SDK for any of its APIs — there is no
    nordstellar-python/-node/-go package on any registry. The first-party packages that do exist are
    agent/automation plumbing (the MCP auth proxy, the n8n node) and low-level networking libraries
    from the VPN client stack. NordStellar's own docs teach the APIs with raw Python `requests`
    examples rather than an SDK.
