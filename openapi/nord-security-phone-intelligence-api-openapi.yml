                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: tls-crypt-v2
                              data:
                                type: string
                                example: '-----BEGIN CERTIFICATE----..***..-----END CERTIFICATE'
            email_clients:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Mozilla Thunderbird
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        server:
                          type: string
                          example: imap.example.com
                        username:
                          type: string
                          example: username
                        password:
                          type: string
                          example: password1
            downloads:
              type: array
