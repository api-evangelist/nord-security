components:
  headers:
    X-Quota-Remaining:
      schema:
        type: integer
      description: The number of requests left for the period
    X-Quota-Limit:
      schema:
        type: integer
      description: Quota limit per minute
    X-RateLimit-Reset:
      schema:
        type: string
        format: date-time
      description: Date and time when rate limit counter resets
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of requests left for the time window
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Request limit per minute
  schemas:
    PhoneSample:
      type: object
      properties:
        id:
          type: string
          example: 631dadc9288c13b61bb83c480292c11154b35b5bb777a4946980de62f70477eb
        phone:
          type: string
          example: '13855550193'
          description: International format phone number
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseDataItem'
        malware_logs:
          type: array
          items:
            $ref: '#/components/schemas/MalwareDataItem'
        risk_assessment:
          $ref: '#/components/schemas/EmailSample/properties/risk_assessment'
    DatabaseDataItem:
      type: object
      properties:
        identifier:
          type: string
          description: Identifier in the following format {domain}_{top level domain}
          example: example_com
        id:
          type: string
          description: Systemic hex ID of the record
          example: 66c4d3912b183418f7743576
        published_date:
          type: string
          description: Date when the database data was published onto the asset
          example: '2025-01-20T19:04:39Z'
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Key of the data point, complete list can be found [HERE](https://docs.nordstellar.com/enterprise-apis/product-integrations/data-categories#data-points)
                example: password
              value:
                type: array
                items:
                  type: string
                description: Value of the data point
                example:
                - password1
                - password2
        risk_assessment:
          $ref: '#/components/schemas/EmailSample/properties/risk_assessment'
    MalwareLogSystemInfoSampleItem:
      type: object
      properties:
        ip:
          type: string
          example: 192.168.1.1
        username:
          type: string
          example: diego.lebon
        country:
          type: string
          example: US
        zip:
          type: string
          example: '10001'
        location:
          type: string
          example: New York, USA
        hardware_id:
          type: string
          example: 89f3221e-2138-48c9-bbe2-8f68-806e6f6e6963
        language:
          type: string
          example: es-ES
        timezone:
          type: string
          example: UTC1
        os:
          type: string
          example: Windows 10 Pro [x64]
        system_name:
          type: string
          example: DESKTOP-42R6V1I
        guid:
          type: string
          example: 91788e64-8fdf-11eb-8f68-806e6f6e6963
        machine_id:
          type: string
          example: 89f3221e-2138-48c9-bbe2-ab615454c7ef
        date:
          type: string
          example: '2021-05-26T08:19:13Z'
        execution_path:
          type: string
          example: C:\Program Files\Example\example.exe
        antivirus_software:
          type: array
          items:
            type: string
            example: Norton Antivirus
        work_dir:
          type: string
          example: C:\Users\appdata
        oem_id:
          type: string
          example: 00000000-0000-0000-0000-0000
        screen_size:
          type: string
          example: 1920x1080
        uac:
          type: string
          example: AllowAll
        process_elevation:
          type: boolean
          example: true
        keyboard_layouts:
          type: array
          items:
            type: string
            example: English (United States)
        hardwares:
          type: array
          items:
            type: string
            example: Intel(R) Core(TM) i7-9700 CPU @ 3.00GHz
    PhonesDatabasesSample:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhoneDatabasesSample'
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
    MalwareDataItem:
      type: object
      properties:
        identifier:
          type: string
          description: Malware identifier composed by malicious code
          example: US[97F6DE35E58C06E6ED60B78FC35739E4] [2023-07-21T01_15_33.9687566]
        id:
          type: string
          description: Systemic hex ID of the record
          example: 678e9e47098d6b3b44f75ec8
        type:
          type: string
          description: Name or brand of the infostealer (may be empty or unknown)
          example: risepro
        published_date:
          type: string
          description: Date that malware log has been published
          example: '2025-01-20T19:04:39Z'
        data:
          type: object
          properties:
            credentials:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    example: https://login.example.com/path/to/login
                  cleaned_url:
                    type: string
                    example: login.example.com
                  username:
                    type: string
                    example: username
                  email:
                    type: string
                    example: example@example.com
                  password:
                    type: string
                    example: password1
                  application:
                    type: string
                    example: Google Chrome
            cookies:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: SEARCH_SAMESITE
                  value:
                    type: string
                    example: CgQItZIB
                  path:
                    type: string
                    example: /
                  domain:
                    type: string
                    example: google.com
                  expires:
                    type: string
                    example: '2021-10-21T12:22:38Z'
            autofills:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: '0000000000000000011'
                  value:
                    type: string
                    example: example@example.com
                  browser:
                    type: string
                    example: Google Chrome
            grabbed_files:
              type: array
              items:
                type: string
                example: /work/important.docx
            credit_cards:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: John Doe
                  card_number:
                    type: string
                    example: '4111111111111111'
                  cvv:
                    type: string
                    example: '123'
                  expiration_date:
                    type: string
                    example: 12/25
            system_info:
              $ref: '#/components/schemas/MalwareLogSystemInfoSampleItem'
            metadata:
              type: object
              properties:
                incident_date:
                  type: string
                  example: '2021-05-26T08:19:13Z'
                emails:
                  type: array
                  items:
                    type: string
                    example: example@example.com
                phones:
                  type: array
                  items:
                    type: string
                    example: '15551234567'
                ips:
                  type: array
                  items:
                    type: string
                    example: 203.0.113.42
                hardware_id:
                  type: string
                  example: 89f3221e-2138-48c9-bbe2-8f68-806e6f6e6963
                machine_id:
                  type: string
                  example: 89f3221e-2138-48c9-bbe2-ab615454c7ef
                country:
                  type: string
                  example: US
            secret:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: aws-access-token
                  values:
                    type: array
                    items:
                      type: string
                      example: AKIAIOSFODNN7EXAMPLE
            ftp:
              type: array
              items:
                type: object
                properties:
                  host:
                    type: string
                    example: ftp.example.com
                  port:
                    type: integer
                    example: 21
                  username:
                    type: string
                    example: username
                  password:
                    type: string
                    example: password1
                  applications:
                    type: array
                    items:
                      type: string
                      example: FileZilla
                  cert:
                    type: object
                    properties:
                      data:
                        type: string
                        example: abcd123123123123123123123
                      activation_time:
                        type: integer
                        example: 1652227200
                      expiration_time:
                        type: integer
                        example: 1660089599
                      host:
                        type: string
                        example: ftp.example.com
                      port:
                        type: integer
                        example: 21
                      trust_sans:
                        type: integer
                        example: 1
            installed_software:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: FileZilla Server
                  version:
                    type: string
                    example: 0.9.60
            process_list:
              type: array
              items:
                type: object
                properties:
                  pid:
                    type: integer
                    example: 11708
                  name:
                    type: string
                    example: uTorrent.exe
                  session_name:
                    type: string
                    example: Console
                  cmd:
                    type: string
                    example: C:\Users\steam\AppData\Roaming\utorrent\uTorrent.exe  /MINIMIZED
            rdp:
              type: array
              items:
                type: object
                properties:
                  server:
                    type: string
                    example: Yandex.Browser
                  username:
                    type: string
                    example: username
                  password:
                    type: string
                    example: password1
            rac:
              type: array
              items:
                type: object
                properties:
                  private_key:
                    type: string
                    example: '-----BEGIN PRIVATE KEY----..***..-----END PRIVATE'
                  certificate:
                    type: string
                    example: '-----BEGIN CERTIFICATE----..***..-----END CERTIFICATE'
            ssh:
              type: object
