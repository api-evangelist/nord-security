components:
  schemas:
    EmailsSample:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmailSample'
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
    EmailCredentialListsSample:
      type: object
      properties:
        id:
          type: string
          example: 2a539d6520266b56c3b0c525b9e6128858baeccb5ee9b694a2906e123c8d6dd3
        email:
          type: string
          example: example@example.com
        credential_lists:
          type: array
          items:
            $ref: '#/components/schemas/CredentialDataItem'
    DatabaseDataItem:
      type: object
      properties:
        identifier:
          type: string
          description: Identifier in the following format {domain}_{top level domain}
          example: example_com
        id:
          type: string
          description: Systemic hex ID of the record
          example: 66c4d3912b183418f7743576
        published_date:
          type: string
          description: Date when the database data was published onto the asset
          example: '2025-01-20T19:04:39Z'
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: Key of the data point, complete list can be found [HERE](https://docs.nordstellar.com/enterprise-apis/product-integrations/data-categories#data-points)
                example: password
              value:
                type: array
                items:
                  type: string
                description: Value of the data point
                example:
                - password1
                - password2
        risk_assessment:
          $ref: '#/components/schemas/EmailSample/properties/risk_assessment'
    EmailsAto:
      required:
      - emails_sha256
      type: object
      properties:
        emails_sha256:
          type: array
          description: A list of SHA256 hashed email addresses to generate fuzzed passwords
          items:
            type: string
