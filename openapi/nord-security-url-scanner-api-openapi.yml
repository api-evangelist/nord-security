                  format: abp
                  action: allow
                  latest_version: '20210519100050'
                  latest_version_checksum: d9a16f8ca96155c176e0623cf3a0589609869b2e
                - identifier: 3q3aj2YricicsPQv
                  category: broken-apps
                  uri: /v1/cybersec/lists/broken-apps/3q3aj2YricicsPQv
