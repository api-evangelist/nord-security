openapi: 3.2.0
info:
  description: Cybersec API documentation
  version: 1.0.0
  title: Cybersec URL scanner API
servers:
- url: https://cybersec.nordstellar.com
security:
- ApiKeyAuth: []
tags:
- name: URL Scanner
  description: ''
paths:
  /v2/cybersec/urlscanner/config:
    get:
      operationId: urlScannerConfig
      tags:
      - URL Scanner
      summary: Get config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlscannerConfigResponse'
              example:
                process_allow_list:
                - chrome
                - firefox
                - opera
                - safari
                - msedge
                - com.apple.webkit.networking
                - brave
                - iexplore
                av_scan_types:
                - text/html
                - text/javascript
                - text/ecmascript
                - text/jscript
                - text/livescript
                - text/x-ecmascript
                - text/x-javascript
                - application/
                lists:
                - identifier: F8e5mS89RX1wDO61
                  category: tracking
                  uri: /v1/cybersec/lists/tracking/F8e5mS89RX1wDO61
                  format: abp
                  action: block
                  latest_version: '20210823105700'
                  latest_version_checksum: ea08f49338174bd7f4817ef986e21e550363db3e
                - identifier: kPayrrMJP0d4nEPl
                  category: adblock
                  uri: /v1/cybersec/lists/adblock/kPayrrMJP0d4nEPl
                  format: abp
                  action: block
                  latest_version: '20210823105700'
                  latest_version_checksum: 998b3c2a3ca07f66a3a0076a45363bacd42b6d77
                  language: en
                - identifier: 3OcJr9MGhdAPyGjI
