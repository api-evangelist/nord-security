                cookie_leak_core_resp_ttl:
                  value: 24
                  unit: h
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Authorization header not provided:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Authorization%20header%20not%20provided'
                Invalid authorization header:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Invalid%20authorization%20header'
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
components:
  responses:
    AuthServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Service unavailable:
              value:
                errors:
                  code: 904178
                  message: Service temporary unavailable
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
    ServiceForbidden:
      description: Service is forbidden for the user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Service is forbidden for the user:
              value:
                errors:
                  code: 100166
                  message: Service is forbidden for the user
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
    InvalidCredentials:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Invalid credentials:
              value:
                errors:
                  code: 100104
                  message: Invalid credentials
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
  schemas:
    ListFormat:
      type: string
      enum:
      - abp
      - zone
      - domain
      - queryparam
      description: List content format
    ListCategory:
      type: string
      enum:
      - adblock
      - tracking
      - malwaresec
      - broken-apps
      - urlstripping
      - cookies
    ListAction:
      type: string
      enum:
      - block
      - allow
      - no-mitm
      - redirect
      description: Action to take when ant item is matched in this list
    ListIdentifier:
      type: string
      example: kPayrrMJP0d4nEPl
    CybersecList:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ListAction'
        category:
          $ref: '#/components/schemas/ListCategory'
        format:
          $ref: '#/components/schemas/ListFormat'
        identifier:
          $ref: '#/components/schemas/ListIdentifier'
        latest_version:
          $ref: '#/components/schemas/ListVersion'
        latest_version_checksum:
          $ref: '#/components/schemas/Sha1Checksum'
        uri:
          description: List content download URL
          type: string
          example: /v1/cybersec/lists/adblock/kPayrrMJP0d4nEPl
        language:
          type: string
          example: en
    Sha1Checksum:
      type: string
      example: 82751542dc5cd0ce4b0b78d61302ca058f8dac12
    ListVersion:
      type: string
      example: 20200501120000
    X-Correlation-ID:
      type: string
      format: uuid
      example: ddd58a90-57c3-4bd1-a9ed-649a9451f0a7
      description: Unique identifier for correlating requests, responses and logs across distributed services
    ErrorResponse:
      type: object
      properties:
        errors:
          type: object
          properties:
            code:
              type: integer
              example: 123
            message:
              type: string
              example: Some error
    UrlscannerConfigResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/CybersecList'
        process_allow_list:
          type: array
          items:
            type: string
        av_scan_types:
          type: array
          items:
            type: string
        client_url_cloud_timeout:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
        allowed_domains_update_period:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
        cookie_leak_check_period:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
        cookie_leak_core_resp_ttl:
          type: object
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Set token with a prefix like this: `token:69405a802dba4f57804e5fff11061946a579d159d1a51760d19a50aec241adc9`'
