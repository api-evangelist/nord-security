  parameters:
    Offset:
      name: offset
      in: query
      description: Offset the results by an integer
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      description: Limit the count of records in results
      required: false
      schema:
        type: integer
    SubscriptionId:
      name: id
      in: path
      required: true
      description: Subscription ID which was provided upon subscription creation
      schema:
        type: string
  headers:
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of requests left for the time window
    X-Quota-Remaining:
      schema:
        type: integer
      description: The number of requests left for the period
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Request limit per minute
    X-Quota-Limit:
      schema:
        type: integer
      description: Quota limit per minute
    X-RateLimit-Reset:
      schema:
        type: string
        format: date-time
      description: Date and time when rate limit counter resets
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Authorization string. Needs to be in the standard BasicAuth format - "Basic BASE64_CREDENTIALS", where BASE64_CREDENTIALS is the user username:password encoded in base64 format.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
