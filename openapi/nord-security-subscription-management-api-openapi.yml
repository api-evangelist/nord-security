  /subscription/bulk:
    delete:
      tags:
      - Subscription Management
      summary: Delete subscriptions
      description: 'Used for deleting multiple subscriptions for the current user.

        Accepts between 1 and 1000 subscription IDs.


        **This operation is non-reversible.**'
      operationId: deleteSubscriptionsBulk
      requestBody:
        content:
          application/json:
            schema:
              required:
              - ids
              type: object
              properties:
                ids:
                  type: array
                  description: List of subscription IDs to delete. Minimum 1, maximum 1000.
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    example: 507f1f77bcf86cd799439011
        required: true
      responses:
        '200':
          description: Returns deleted subscriptions data
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
