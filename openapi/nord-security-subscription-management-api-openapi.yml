        '404':
          description: No data found
          content: {}
      security:
      - ApiKeyAuth: []
components:
  schemas:
    AssetSubscriptions:
      required:
      - subscription_identifier
      type: object
      properties:
        subscription_identifiers:
          type: array
          description: Up to 200 **SHA-256** hashed email addresses or phone numbers (only digits)
          items:
            type: string
          example:
          - 2fc8583f3be53fcf1a6e0f972869478e392ef2a6f62b7b3735ca53af921ea304
        dispatch_on_update:
          type: boolean
          description: Dispatch alert on existing data breach updates, e.g. when more data keys are added to the data
          example: false
    SubscriptionSample:
      type: object
      properties:
        id:
          type: string
          description: Subscription ID
          example: 507f1f77bcf86cd799439011
        subscription_type:
          type: string
          description: Subscription type - **domain**, **email-sha256**, **phone-sha256**, **cc-argon2id**, **nin-argon2id**, **cc-sha1** or **nin-sha1**
          example: email-sha256
        subscription_identifier:
          type: string
          description: Subscription identifier - domain, SHA-256 hashed email address, SHA-256 hashed phone number (only digits), Argon2ID or SHA-1 hashed credit card number or Argon2ID or SHA-1 hashed national identification number
        date_created:
          type: string
        dispatch_on_update:
          type: boolean
          description: Dispatch alert on existing data breach updates, e.g. when more data keys are added to the data
          example: true
    DomainSubscriptions:
      required:
      - subscription_identifier
      type: object
      properties:
        subscription_identifiers:
          type: array
          description: Up to 200 raw email address domains, e.g. ["example.com", "example.org"]
          items:
            type: string
