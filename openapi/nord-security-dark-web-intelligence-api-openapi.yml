      tags:
      - Dark Web Intelligence
      summary: Scraped forum content search
      description: 'This endpoint allows users to search through scraped forum content found on the dark web using a Lucene query as the main search query.

        It provides a powerful and flexible search capability by allowing users to construct complex queries to filter and retrieve specific forum content.


        **Example Lucene Query:**

        - To search for posts with the word "malware" in the content field, authored by "john doe":


        `content:malware AND author_name:"john doe"`


        Search phrases can be optionally highlighted in the search results using the `highlight_params` object.

        All keywords that are matched by the query will be wrapped with passed starting and ending tags.


        The endpoint can return a maximum of 10,000 records. An offset plus limit that exceeds 10,000 will result in a bad request


        **Rate limit: 50 per second.**'
      operationId: forumSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumSearchRequest'
      responses:
        '200':
          description: Returns a list of forum threads
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Request limit per second. Defaults 200 per second
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of requests left for the time window.
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumSearchResponse'
