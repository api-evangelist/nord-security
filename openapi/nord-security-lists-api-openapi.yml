          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Authorization header not provided:
                  value:
                    errors:
                      code: 100105
                      message: Authorization header not provided
                Invalid authorization header:
                  value:
                    errors:
                      code: 100106
                      message: Invalid authorization header
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /v2/cybersec/lists/{listCategory}/{listIdentifier}:
    get:
      operationId: listGet
      tags:
      - Lists
      summary: Get list content
      description: This endpoint can return different content versions based on the optional version query parameter. Without this query parameter, it will return the latest content version. Even though it is not mandatory, you should always specify the version parameter if possible.
      parameters:
      - $ref: '#/components/parameters/ListCategory'
      - $ref: '#/components/parameters/ListIdentifier'
      - $ref: '#/components/parameters/ListVersion'
      responses:
        '200':
          description: Successful response
          headers:
            X-List-Version:
              schema:
                $ref: '#/components/schemas/ListVersion'
              description: Version of the returned list
            X-List-Checksum:
              schema:
                $ref: '#/components/schemas/Sha1Checksum'
              description: Sha1 sum of the complete list
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
          content:
            text/plain:
              schema:
                type: string
                example: '&ad.vid=$~xmlhttprequest

                  &ad_block=

                  &ad_classid=

                  &ad_code=

                  &ad_height=

                  &ad_ids=

                  &ad_keyword=

                  &ad_network_

                  &ad_slot=

                  &ad_sub=

                  &ad_time=

                  &ad_type=

                  &ad_type_

                  &ad_url=

                  '
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid category parameter:
                  value:
                    errors:
                      code: 902151
                      message: Invalid category parameter
                Invalid identifier parameter:
                  value:
                    errors:
                      code: 902153
                      message: Invalid identifier parameter
                Authorization header not provided:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Authorization%20header%20not%20provided'
                Invalid authorization header:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Invalid%20authorization%20header'
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid authorization header:
                  $ref: '#/paths/~1v2~1cybersec~1lists~1%7BlistCategory%7D~1%7BlistIdentifier%7D~1diffs/get/responses/404/content/application~1json/examples/List%20not%20found'
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
  /v2/cybersec/lists/{listCategory}/{listIdentifier}/diffs:
    get:
      operationId: listGetDiff
      tags:
      - Lists
      summary: Get list diff
      description: This endpoint returns category list file differences between two specified versions. Returned diff is formatted in unified patch format (https://www.gnu.org/software/diffutils/manual/html_node/Example-Unified.html#Example-Unified).
      parameters:
      - $ref: '#/components/parameters/ListCategory'
      - $ref: '#/components/parameters/ListIdentifier'
      - name: version_from
        in: query
        schema:
          $ref: '#/components/schemas/ListVersion'
        description: Version of the list to calculate diff from
        required: true
      - name: version_to
        in: query
        schema:
          $ref: '#/components/schemas/ListVersion'
        description: Version of the list to calculate diff from
        required: false
      responses:
        '200':
          description: Successful response
          headers:
            X-List-Version:
              schema:
                $ref: '#/components/schemas/ListVersion'
              description: Version of the returned list
            X-List-Checksum:
              schema:
                $ref: '#/components/schemas/Sha1Checksum'
              description: Sha1 sum of the complete list
            X-Diff-Checksum:
              schema:
                $ref: '#/components/schemas/Sha1Checksum'
              description: Sha1 sum of returned diff contents
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
          content:
            text/plain:
              schema:
                type: string
                example: "--- 20201105123100\t2021-02-12 12:16:40.713104979 +0000\n+++ 20201210235100\t2021-02-12 12:16:48.817074016 +0000\n@@ -33,7 +33,6 @@\n&adsafe=\n&adserv=\n&adserver=\n-&adsize=\n&adslot=\n&adslots=\n&adsourceid=\n@@ -47,7 +46,6 @@\n&adv_keywords=\n&advert_\n-&advid=$~image\n&adzone=\n&banner_id=\n&bannerid=\n"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid category parameter:
                  $ref: '#/paths/~1v2~1cybersec~1lists~1%7BlistCategory%7D~1%7BlistIdentifier%7D/get/responses/400/content/application~1json/examples/Invalid%20category%20parameter'
                Invalid identifier parameter:
                  $ref: '#/paths/~1v2~1cybersec~1lists~1%7BlistCategory%7D~1%7BlistIdentifier%7D/get/responses/400/content/application~1json/examples/Invalid%20identifier%20parameter'
                Authorization header not provided:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Authorization%20header%20not%20provided'
                Invalid authorization header:
                  $ref: '#/paths/~1v2~1cybersec~1lists/get/responses/400/content/application~1json/examples/Invalid%20authorization%20header'
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ServiceForbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                List not found:
                  value:
                    errors:
                      code: 902154
                      message: List not found
          headers:
            X-Correlation-ID:
              $ref: '#/components/schemas/X-Correlation-ID'
        '503':
          $ref: '#/components/responses/AuthServiceUnavailable'
components:
  responses:
    AuthServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Service unavailable:
              value:
                errors:
                  code: 904178
                  message: Service temporary unavailable
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
    ServiceForbidden:
      description: Service is forbidden for the user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Service is forbidden for the user:
              value:
                errors:
                  code: 100166
                  message: Service is forbidden for the user
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
    InvalidCredentials:
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Invalid credentials:
              value:
                errors:
                  code: 100104
                  message: Invalid credentials
      headers:
        X-Correlation-ID:
          $ref: '#/components/schemas/X-Correlation-ID'
  schemas:
    ListFormat:
      type: string
      enum:
      - abp
      - zone
      - domain
      - queryparam
      description: List content format
    ListCategory:
      type: string
      enum:
      - adblock
      - tracking
      - malwaresec
      - broken-apps
      - urlstripping
      - cookies
    ListAction:
      type: string
      enum:
      - block
      - allow
      - no-mitm
      - redirect
      description: Action to take when ant item is matched in this list
    ListIdentifier:
      type: string
      example: kPayrrMJP0d4nEPl
    ListVersion:
      type: string
      example: 20200501120000
    Sha1Checksum:
      type: string
      example: 82751542dc5cd0ce4b0b78d61302ca058f8dac12
    CybersecList:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ListAction'
        category:
          $ref: '#/components/schemas/ListCategory'
        format:
          $ref: '#/components/schemas/ListFormat'
        identifier:
          $ref: '#/components/schemas/ListIdentifier'
        latest_version:
          $ref: '#/components/schemas/ListVersion'
        latest_version_checksum:
          $ref: '#/components/schemas/Sha1Checksum'
        uri:
          description: List content download URL
          type: string
          example: /v1/cybersec/lists/adblock/kPayrrMJP0d4nEPl
        language:
          type: string
          example: en
    X-Correlation-ID:
      type: string
      format: uuid
      example: ddd58a90-57c3-4bd1-a9ed-649a9451f0a7
      description: Unique identifier for correlating requests, responses and logs across distributed services
    ErrorResponse:
      type: object
      properties:
        errors:
          type: object
          properties:
            code:
              type: integer
              example: 123
            message:
              type: string
              example: Some error
  parameters:
    ListCategory:
      name: listCategory
      in: path
      schema:
        $ref: '#/components/schemas/ListCategory'
      description: List category
      required: true
    ListIdentifier:
      name: listIdentifier
      in: path
      schema:
        $ref: '#/components/schemas/ListIdentifier'
      description: List identfier
      required: true
    ListVersion:
      name: version
      in: query
      schema:
        $ref: '#/components/schemas/ListVersion'
      description: List version
      required: false
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Set token with a prefix like this: `token:69405a802dba4f57804e5fff11061946a579d159d1a51760d19a50aec241adc9`'
