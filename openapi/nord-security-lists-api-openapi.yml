openapi: 3.2.0
info:
  description: Cybersec API documentation
  version: 1.0.0
  title: Cybersec Lists API
servers:
- url: https://cybersec.nordstellar.com
security:
- ApiKeyAuth: []
tags:
- name: Lists
  description: ''
paths:
  /v2/cybersec/lists:
    get:
      operationId: lists
      tags:
      - Lists
      summary: Get lists
      description: Retrieves a list of available cybersec lists
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CybersecList'
              example:
              - identifier: F8e5mS89RX1wDO61
                category: tracking
                uri: /v1/cybersec/lists/tracking/F8e5mS89RX1wDO61
                format: abp
                action: block
                latest_version: '20210823105700'
                latest_version_checksum: ea08f49338174bd7f4817ef986e21e550363db3e
              - identifier: kPayrrMJP0d4nEPl
                category: adblock
                uri: /v1/cybersec/lists/adblock/kPayrrMJP0d4nEPl
                format: abp
                action: block
                latest_version: '20210823105700'
                latest_version_checksum: 998b3c2a3ca07f66a3a0076a45363bacd42b6d77
                language: en
              - identifier: 3OcJr9MGhdAPyGjI
